<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&family=Yeseva+One&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="container py-5">
      <h1 class="mb-4">User Registration</h1>
      <form id="registerForm" class="card p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="firstName">First Name</label>
            <input class="form-control" id="firstName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="lastName">Last Name</label>
            <input class="form-control" id="lastName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="dob">Date of Birth</label>
            <input class="form-control" id="dob" type="date" required>
          </div>
          <div class="col-md-6">
            <label class="form-label d-block">Gender</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="genderF" value="Female" required>
              <label class="form-check-label" for="genderF">Female</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="genderM" value="Male" required>
              <label class="form-check-label" for="genderM">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="genderO" value="Other" required>
              <label class="form-check-label" for="genderO">Other</label>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="mobile">Mobile Number</label>
            <input class="form-control" id="mobile" type="tel" placeholder="10 digits" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="email">Email ID</label>
            <input class="form-control" id="email" type="email" required>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Register</button>
          <a class="btn btn-outline-secondary" href="list.html">View List</a>
        </div>
        <p class="text-danger mt-3" id="errorMsg"></p>
      </form>
    </div>

    <script src="register.js"></script>
  </body>
</html>
