<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hospital Patient Registration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700&family=Prata&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark hospital-nav">
      <div class="container">
        <a class="navbar-brand" href="#">City Hospital</a>
      </div>
    </nav>

    <header class="hero">
      <div class="container">
        <h1 class="display-4">Patient Registration</h1>
        <p>Register patients for quick admission processing.</p>
      </div>
    </header>

    <main class="container my-5">
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="form-card">
            <h2 class="section-title">Registration Form</h2>
            <form id="patientForm" class="mt-3">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="fullName">Full Name</label>
                  <input class="form-control" id="fullName" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="age">Age</label>
                  <input class="form-control" id="age" type="number" min="0" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="gender">Gender</label>
                  <select class="form-select" id="gender" required>
                    <option value="">Select</option>
                    <option>Female</option>
                    <option>Male</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="phone">Phone</label>
                  <input class="form-control" id="phone" type="tel" required>
                </div>
                <div class="col-12">
                  <label class="form-label" for="reason">Reason for Visit</label>
                  <textarea class="form-control" id="reason" rows="3" required></textarea>
                </div>
              </div>
              <button class="btn btn-primary mt-3" type="submit">Submit Registration</button>
            </form>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="count-card">
            <h3>Registered Patients</h3>
            <p class="count" id="patientCount">0</p>
            <p class="text-muted">Count updates after each submission.</p>
          </div>
        </div>
      </div>
    </main>

    <footer class="hospital-footer text-center">
      <small>© <span id="year"></span> City Hospital</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
