<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Feedback Form</title>
    <link rel="stylesheet" href="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
    <script src="https://code.jquery.com/mobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
  </head>
  <body>
    <div data-role="page" id="feedback">
      <div data-role="header">
        <h1>Feedback</h1>
      </div>
      <div role="main" class="ui-content">
        <form>
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name">

          <label for="rating">Rating</label>
          <select id="rating" data-role="flipswitch">
            <option value="no">Average</option>
            <option value="yes">Great</option>
          </select>

          <label for="message">Comments</label>
          <textarea id="message" placeholder="Share your feedback"></textarea>

          <button class="ui-btn ui-btn-b">Submit</button>
        </form>
      </div>
      <div data-role="footer">
        <h4>Thank you</h4>
      </div>
    </div>
  </body>
</html>
