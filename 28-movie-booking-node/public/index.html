<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movie Ticket Booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Staatliches&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark movie-nav">
      <div class="container">
        <a class="navbar-brand" href="#">MovieBook</a>
      </div>
    </nav>

    <header class="hero">
      <div class="container">
        <h1 class="display-4">Book Your Movie Tickets</h1>
        <p>Choose a movie, select seats, and confirm instantly.</p>
      </div>
    </header>

    <main class="container my-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card movie-card">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Movie 1">
            <div class="card-body">
              <h5>Skyline Mission</h5>
              <p>Action | 2h 10m</p>
              <button class="btn btn-outline-light">Book Now</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card movie-card">
            <img src="https://images.unsplash.com/photo-1517602302552-471fe67acf66?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Movie 2">
            <div class="card-body">
              <h5>Moonlight Tales</h5>
              <p>Drama | 1h 55m</p>
              <button class="btn btn-outline-light">Book Now</button>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card movie-card">
            <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop" class="card-img-top" alt="Movie 3">
            <div class="card-body">
              <h5>Neon Nights</h5>
              <p>Sci-Fi | 2h 20m</p>
              <button class="btn btn-outline-light">Book Now</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="movie-footer text-center">
      <small>© 2026 MovieBook</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
